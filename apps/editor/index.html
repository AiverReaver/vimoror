<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>vimorror stage editor</title>
    <style>
      /* Styles live here rather than in a stylesheet, matching
         `packages/render/demo/index.html`. The editor is three panes and a
         toolbar; a CSS pipeline would be one more thing in the way. */
      :root {
        color-scheme: dark;
        --ink: #d8d8d8;
        --dim: #8a8a94;
        --edge: #33333d;
        --panel: #14141a;
      }
      body {
        margin: 0;
        background: #0b0b0e;
        color: var(--ink);
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      .app {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 8px 0 0;
      }
      main,
      footer {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      /* A stage wider than the frame scrolls inside the preview rather than
         squeezing the buffer pane to nothing — measured with a 512-column
         frame, which collapsed the textarea to its own label. */
      main > .pane:last-child {
        min-width: 0;
        overflow-x: auto;
      }
      main > .pane:first-child {
        flex: 1 1 340px;
        min-width: 0;
      }
      footer > .pane {
        flex: 1 1 0;
        min-width: 0;
      }
      .pane {
        border: 1px solid var(--edge);
        background: var(--panel);
        padding: 8px;
      }
      .pane h2 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 0 0 6px;
      }
      .buffer {
        width: 100%;
        box-sizing: border-box;
        height: 340px;
        background: #0b0b0e;
        color: var(--ink);
        border: 1px solid var(--edge);
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 13px;
        line-height: 1.4;
        padding: 6px;
        resize: vertical;
      }
      .grid {
        display: block;
        background: #0b0b0e;
        border: 1px solid var(--edge);
        cursor: pointer;
      }
      /* Wave C's three panels, side by side under the dual pane and each free to
         scroll on its own — the entities and beats lists have no bounded height,
         and a page that grows to the tallest of them leaves the other two as
         stripes at the top. */
      .panels {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .panels > .pane {
        flex: 1 1 0;
        min-width: 0;
        max-height: 460px;
        overflow-y: auto;
      }
      .pane h3 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 10px 0 4px;
        border-top: 1px solid var(--edge);
        padding-top: 6px;
      }
      .field {
        display: flex;
        gap: 6px;
        align-items: baseline;
        margin-bottom: 4px;
      }
      .field-label {
        flex: 0 0 84px;
        color: var(--dim);
        font-family: ui-monospace, monospace;
      }
      .field input[type='text'],
      .field select,
      .field textarea {
        flex: 1 1 0;
        min-width: 0;
      }
      .field .num {
        flex: 0 0 72px;
      }
      input,
      textarea {
        font: inherit;
        background: #0b0b0e;
        color: var(--ink);
        border: 1px solid var(--edge);
        padding: 3px 5px;
      }
      textarea.lines {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        resize: vertical;
      }
      .row {
        border: 1px solid var(--edge);
        padding: 5px;
        margin-bottom: 5px;
      }
      .row.selected {
        border-color: #5fe07a;
      }
      .row-head {
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      .row-body {
        margin-top: 6px;
      }
      /* The palette's colours are the preview's, so the armed button and the
         cells it paints are recognisably the same thing. They are literal rather
         than read from `ENTITY_SKIN` because this is CSS — and a test asserting a
         cell against the same table it came from is the self-referential trap the
         Wave B checklist entry documents, so the duplication is at least visible. */
      .palette {
        display: flex;
        gap: 4px;
        margin-bottom: 6px;
      }
      .palette button {
        flex: 1 1 0;
      }
      .palette .armed {
        outline: 1px solid currentColor;
      }
      .palette .goal.armed {
        color: #5fe07a;
        background: #0d3d18;
      }
      .palette .wall.armed {
        color: #c3c9d8;
        background: #2a2a34;
      }
      .palette .threat.armed {
        color: #ff7b6b;
        background: #4a0f12;
      }
      .palette .pickup.armed {
        color: #ffd452;
        background: #3d3208;
      }
      .grid.painting {
        cursor: crosshair;
      }
      button.link {
        flex: 1 1 0;
        text-align: left;
        border-color: transparent;
        background: none;
        font-family: ui-monospace, monospace;
      }
      .condition {
        flex: 1 1 0;
      }
      .note {
        color: var(--dim);
        margin: 0;
        font-family: ui-monospace, monospace;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        color: #ffb4a2;
      }
      .ok {
        color: #5fe07a;
      }
      .bad {
        color: #ff7b6b;
      }
      button,
      select {
        font: inherit;
        background: #1c1c24;
        color: var(--ink);
        border: 1px solid var(--edge);
        padding: 4px 8px;
      }
      button:disabled {
        color: #55555f;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
