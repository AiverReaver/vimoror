<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>vimorror</title>
    <style>
      /* Inline, matching `apps/editor/index.html` and the render demo. The game
         is a canvas and some chrome around it; a CSS pipeline would be one more
         thing in the way. */
      :root {
        color-scheme: dark;
        --ink: #d8d8d8;
        --dim: #8a8a94;
        --line: #23232b;
        --paper: #14141a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0b0e;
        color: var(--ink);
        font-family: system-ui, sans-serif;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px 16px;
        box-sizing: border-box;
      }
      code {
        font-family: ui-monospace, monospace;
      }
      .dim {
        color: var(--dim);
      }
      .note {
        color: var(--dim);
        margin: 0;
        max-width: 60ch;
        line-height: 1.5;
      }
      .ok {
        color: #5fe07a;
        margin: 0;
      }
      .bad {
        color: #ff7b6b;
        margin: 0;
      }

      /* ---- the stage list (Wave B scaffolding; Wave C replaces it) ---- */

      .select {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 72ch;
      }
      .select h1 {
        font-family: ui-monospace, monospace;
        font-size: 20px;
        letter-spacing: 0.3em;
        margin: 0;
      }
      .difficulty {
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0;
      }
      .difficulty legend {
        color: var(--dim);
      }
      .difficulty label {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .stages {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .stages li {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      /* ---- the runner ---- */

      .run {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }
      .run-head {
        display: flex;
        gap: 16px;
        align-items: baseline;
        font-family: ui-monospace, monospace;
      }
      /* The overlays are positioned against this, not against the canvas: a
         canvas has no layout children, and the plan asks for the beat text and
         the outcome to sit OVER the frame rather than under it. */
      .stage {
        position: relative;
        line-height: 0;
      }
      canvas {
        display: block;
        background: #000;
      }
      .dialogue {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 10px 12px;
        background: rgb(11 11 14 / 88%);
        border-top: 1px solid var(--line);
        font-family: ui-monospace, monospace;
        line-height: 1.5;
      }
      .outcome {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgb(11 11 14 / 92%);
        font-family: ui-monospace, monospace;
        line-height: 1.5;
        text-align: center;
        padding: 16px;
      }
      .status {
        font-family: ui-monospace, monospace;
        color: var(--dim);
        margin: 0;
      }
      .status .mode {
        color: var(--ink);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .status .ghost {
        color: #ffd452;
      }
      .status .refused {
        color: #ff7b6b;
      }
      .hint {
        font-family: ui-monospace, monospace;
        color: var(--dim);
        margin: 0;
      }
      .hint code {
        color: #5fe07a;
      }
      .run-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 4px 10px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--dim);
      }
      button:disabled {
        color: var(--dim);
        cursor: default;
      }
      button:focus-visible {
        outline: 2px solid #ffd452;
        outline-offset: 1px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
