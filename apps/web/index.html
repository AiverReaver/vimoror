<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>vimorror</title>
    <style>
      /* Inline, matching `apps/editor/index.html` and the render demo. The game
         is a canvas and some chrome around it; a CSS pipeline would be one more
         thing in the way. */
      :root {
        color-scheme: dark;
        --ink: #d8d8d8;
        --dim: #8a8a94;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0b0e;
        color: var(--ink);
        font-family: system-ui, sans-serif;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      canvas {
        display: block;
        background: #000;
      }
      .status {
        font-family: ui-monospace, monospace;
        color: var(--dim);
      }
      .bad {
        color: #ff7b6b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
