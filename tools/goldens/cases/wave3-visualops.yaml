# The visual-mode edges left open after Wave 3c: `<C-v>I`/`A`, `p`/`P` and `r`
# over a selection, `gv` reselect, and `$`-to-end-of-line blocks.
#
# Three rules here are not guessable and each has its own case below:
#
#  - `<C-v>I` SKIPS a row too short to reach the block's column; `<C-v>A` PADS
#    it out with spaces. Same block, opposite treatment.
#  - `$` in visual mode parks the cursor ON the end-of-line NUL, which no other
#    motion does. That is why `v$d` joins the next line up while `vlld` over
#    the same characters leaves an empty line behind.
#  - visual `p` overwrites the unnamed register with the text it just removed;
#    visual `P` deliberately does not.

cases:
  # --- blockwise I ----------------------------------------------------------
  - id: visualops/block-I-basic
    buffer: ['abc', 'def', 'ghi']
    cursor: [1, 2]
    keys: '<C-v>jjIX<Esc>'

  - id: visualops/block-I-skips-short-rows
    note: the short row is SKIPPED, not padded — contrast block-A-pads-short-rows
    buffer: ['abcd', 'e', 'fghi']
    cursor: [1, 3]
    keys: '<C-v>jjIX<Esc>'

  - id: visualops/block-I-skips-empty-line
    buffer: ['abc', '', 'ghi']
    cursor: [1, 2]
    keys: '<C-v>jjIX<Esc>'

  - id: visualops/block-I-multichar
    buffer: ['abc', 'def']
    cursor: [1, 2]
    keys: '<C-v>jIXY<Esc>'

  - id: visualops/block-I-newline-abandons-replication
    note: >
      a typed line break stops replication dead — only the first row gets the
      text, which is why <C-v>I with a <CR> in it looks like it silently broke
    buffer: ['abc', 'def']
    cursor: [1, 2]
    keys: '<C-v>jIX<CR>Y<Esc>'

  - id: visualops/block-I-backwards-block
    note: dragging up-and-left still selects the same rectangle
    buffer: ['abcd', 'efgh', 'ijkl']
    cursor: [3, 3]
    keys: '<C-v>kkhIX<Esc>'

  # --- blockwise A ----------------------------------------------------------
  - id: visualops/block-A-basic
    buffer: ['abc', 'def', 'ghi']
    cursor: [1, 1]
    keys: '<C-v>jjlAX<Esc>'

  - id: visualops/block-A-pads-short-rows
    note: THE asymmetry — A pads the short row with spaces where I skipped it
    buffer: ['abcd', 'e', 'fghi']
    cursor: [1, 2]
    keys: '<C-v>jjllAX<Esc>'

  - id: visualops/block-A-dollar-appends-at-each-eol
    note: >
      the `<C-v>$A` idiom. With `$` the column is each row's OWN end, so the
      block is ragged, nothing is short, and nothing is padded
    buffer: ['abc', 'de', 'fghi']
    cursor: [1, 1]
    keys: '<C-v>jj$AX<Esc>'

  - id: visualops/block-A-empty-line-padded
    buffer: ['abc', '', 'ghi']
    cursor: [1, 2]
    keys: '<C-v>jjAX<Esc>'

  # --- where the cursor ends up, which is not uniform ----------------------
  - id: visualops/block-I-cursor-returns-to-block-start
    note: >
      after a block I/A the cursor goes to the BLOCK's left edge, not to the
      last character typed — for A that is nowhere near where the typing was
    buffer: ['abc', 'def']
    cursor: [1, 2]
    keys: '<C-v>jlAXY<Esc>'

  - id: visualops/block-c-keeps-ordinary-insert-cursor
    note: >
      …but block `c` does NOT: it ends on the last typed character like any
      other insert. Same block, same typing, different landing. A single-char
      insert hides this, which is why this case types two
    buffer: ['abcd', 'efgh', 'ijkl']
    cursor: [1, 2]
    keys: '<C-v>jjlcXY<Esc>'

  - id: visualops/block-I-nothing-typed
    note: nothing typed means no replication, so the ordinary rule applies again
    buffer: ['abc', 'def']
    cursor: [1, 2]
    keys: '<C-v>jI<Esc>'

  # --- charwise / linewise I and A -----------------------------------------
  - id: visualops/charwise-I-goes-to-column-zero
    note: >
      column ZERO of the first selected line, not its first non-blank — this is
      NOT normal-mode `I`, even though the key is the same
    buffer: ['  abc']
    cursor: [1, 4]
    keys: 'vlIX<Esc>'

  - id: visualops/charwise-I-multiline
    buffer: ['abc', 'def']
    cursor: [1, 2]
    keys: 'vjIX<Esc>'

  - id: visualops/charwise-A-after-selection-end
    buffer: ['  abc']
    cursor: [1, 3]
    keys: 'vlAX<Esc>'

  - id: visualops/charwise-A-multiline
    buffer: ['abc', 'def']
    cursor: [1, 2]
    keys: 'vjAX<Esc>'

  - id: visualops/linewise-I-column-zero
    buffer: ['  abc', '  def']
    cursor: [1, 3]
    keys: 'VjIX<Esc>'

  - id: visualops/linewise-A-after-cursor
    buffer: ['  abc', '  def']
    cursor: [1, 3]
    keys: 'VjAX<Esc>'

  # --- $ in visual mode -----------------------------------------------------
  - id: visualops/v-dollar-eats-the-newline
    note: >
      `$` is the only motion that parks the cursor on the end-of-line NUL, so
      the inclusive selection reaches past the line and takes the break
    buffer: ['abc', 'd']
    cursor: [1, 1]
    keys: 'v$d'

  - id: visualops/v-ll-does-not
    note: the same three characters selected without `$` — no newline taken
    buffer: ['abc', 'd']
    cursor: [1, 1]
    keys: 'vlld'

  - id: visualops/v-dollar-yank-type
    buffer: ['abc', 'd']
    cursor: [1, 1]
    keys: 'v$y'

  - id: visualops/v-dollar-last-line-has-no-newline
    buffer: 'abc'
    cursor: [1, 1]
    keys: 'v$d'

  - id: visualops/v-dollar-then-h
    buffer: ['abcd', 'e']
    cursor: [1, 1]
    keys: 'v$hd'

  - id: visualops/v-dollar-maxcol-persists-down
    note: MAXCOL survives a `j`, so the selection ends at the NEXT line's end too
    buffer: ['abc', 'de', 'fgh']
    cursor: [1, 1]
    keys: 'v$jd'

  - id: visualops/v-dollar-reset-by-zero
    buffer: ['abc', 'd']
    cursor: [1, 1]
    keys: 'v$0d'

  - id: visualops/v-empty-line-selects-newline
    note: >
      an empty line's column zero already IS its end-of-line position, so `v`
      alone there yields a register holding a bare newline
    buffer: ['a', '', 'b']
    cursor: [2, 1]
    keys: 'vy'

  - id: visualops/block-dollar-delete
    buffer: ['abc', 'de', 'fghi']
    cursor: [1, 1]
    keys: '<C-v>jj$d'

  - id: visualops/block-dollar-yank
    buffer: ['abc', 'de', 'fghi']
    cursor: [1, 1]
    keys: '<C-v>jj$y'

  - id: visualops/block-dollar-change
    buffer: ['abc', 'de', 'fghi']
    cursor: [1, 1]
    keys: '<C-v>jj$cX<Esc>'

  # --- visual p / P ---------------------------------------------------------
  - id: visualops/visual-p-charwise
    note: the register is read BEFORE the delete, or p would paste what it removed
    buffer: ['abc def', 'xyz']
    cursor: [1, 1]
    keys: ['yiw', 'w', 'viwp']

  - id: visualops/visual-P-does-not-clobber-unnamed
    note: >
      identical buffer result, but `p` leaves the REMOVED text in the unnamed
      register and `P` leaves the register untouched — which is what makes
      `viwP` repeatable over several words
    buffer: ['abc def', 'xyz']
    cursor: [1, 1]
    keys: ['yiw', 'w', 'viwP']

  - id: visualops/visual-p-linewise-into-linewise
    buffer: ['abc', 'def', 'ghi']
    cursor: [1, 1]
    keys: ['yy', 'jVp']

  - id: visualops/visual-p-linewise-reg-into-charwise
    note: >
      a linewise register put into a charwise hole SPLITS the line open — the
      head and tail become lines of their own around the register's content
    buffer: ['abc def', 'xyz']
    cursor: [1, 1]
    keys: ['yy', 'w', 'viwp']

  - id: visualops/visual-p-charwise-reg-into-linewise
    buffer: ['abc def', 'xyz']
    cursor: [1, 1]
    keys: ['yiw', 'j', 'Vp']

  - id: visualops/visual-p-block-reg
    buffer: ['ab', 'cd', 'wxyz']
    cursor: [1, 1]
    keys: ['<C-v>jly', '3G', 'vlp']

  - id: visualops/visual-p-empty-selection-last-line
    note: nothing is removed, so the unnamed register is not clobbered either
    buffer: ['abc', '']
    cursor: [1, 1]
    keys: ['yiw', '2G', 'vp']

  - id: visualops/visual-p-named-register
    buffer: ['abc def', 'xyz']
    cursor: [1, 1]
    keys: ['"ayiw', 'w', 'v iw"ap']

  # --- visual r -------------------------------------------------------------
  - id: visualops/visual-r-charwise
    buffer: 'abcdef'
    cursor: [1, 2]
    keys: 'vllrZ'

  - id: visualops/visual-r-across-lines-keeps-breaks
    buffer: ['abc', 'def']
    cursor: [1, 2]
    keys: 'vjrZ'

  - id: visualops/visual-r-linewise
    buffer: ['abc', 'def']
    cursor: [1, 2]
    keys: 'VjrZ'

  - id: visualops/visual-r-block
    buffer: ['abcd', 'efgh', 'ijkl']
    cursor: [1, 2]
    keys: '<C-v>jjlrZ'

  - id: visualops/visual-r-block-skips-short-row
    buffer: ['abcd', 'e', 'ijkl']
    cursor: [1, 2]
    keys: '<C-v>jjlrZ'

  - id: visualops/visual-r-esc-cancels
    note: <Esc> after the r abandons the replace AND the selection
    buffer: 'abcdef'
    cursor: [1, 1]
    keys: 'vlr<Esc>'

  - id: visualops/visual-r-count-is-ignored
    buffer: 'abcdef'
    cursor: [1, 1]
    keys: 'vl2rZ'

  # --- gv -------------------------------------------------------------------
  - id: visualops/gv-reselects-after-esc
    buffer: 'abcdef'
    cursor: [1, 2]
    keys: ['vll<Esc>', 'gvd']

  - id: visualops/gv-reselects-after-operator
    note: the selection survives the operator that consumed it
    buffer: ['abcdef', 'ghijkl']
    cursor: [1, 2]
    keys: ['vlly', 'gvd']

  - id: visualops/gv-keeps-blockwise-kind
    buffer: ['abcd', 'efgh']
    cursor: [1, 1]
    keys: ['<C-v>jl<Esc>', 'gvd']

  - id: visualops/gv-restores-most-recent
    buffer: 'abcdef'
    cursor: [1, 1]
    keys: ['vl<Esc>', 'lll', 'vl<Esc>', 'gvd']

  - id: visualops/gv-in-visual-mode-swaps
    note: from inside visual mode gv swaps to the stored selection
    buffer: 'abcdef'
    cursor: [1, 1]
    keys: ['vll<Esc>', '$', 'vgvd']

  - id: visualops/gv-linewise
    buffer: ['abc', 'def', 'ghi']
    cursor: [1, 1]
    keys: ['Vj<Esc>', 'gvd']
