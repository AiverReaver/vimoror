# Wave 3 — text objects.
#
# A text object is NOT a motion. A motion says "go there" and the operator
# infers a region from where the cursor was; an object names the region
# outright. Two consequences these cases exist to pin:
#
#   - `i(` on a block whose braces sit on their own lines is genuinely
#     LINEWISE, so `di{` removes the body line and `yi{` yields a linewise
#     register. Nothing about the keys says so — it is decided by the shape of
#     the text.
#   - a linewise OBJECT pulls the cursor to column one (`yip`), while a
#     linewise MOTION leaves the column alone (`yy`, `y_`). Same range kind,
#     different rule, because only the object has a real start column.
#
# And the distinction that a buffer diff alone cannot show: an object that is
# NOT FOUND (`di(` with no brackets) aborts the operator and mints no undo
# node, whereas an object found EMPTY (`di(` on `()`) is a degenerate region
# that still runs — it mints a node, and `ci(` there still enters insert.

cases:
  # --- iw / aw --------------------------------------------------------------
  - id: textobj/diw-mid-word
    buffer: 'alpha beta gamma'
    cursor: [1, 8]
    keys: 'diw'
  - id: textobj/daw-mid-word
    note: aw takes the word plus its TRAILING whitespace
    buffer: 'alpha beta gamma'
    cursor: [1, 8]
    keys: 'daw'
  - id: textobj/daw-last-word-takes-leading-space
    note: no trailing whitespace to take, so `aw` takes the LEADING space instead
    buffer: 'alpha beta'
    cursor: [1, 8]
    keys: 'daw'
  - id: textobj/daw-last-word-of-line-does-not-eat-the-break
    buffer: ['one two', 'three']
    cursor: [1, 5]
    keys: 'daw'
  - id: textobj/diw-last-word-of-line
    buffer: ['one two', 'three']
    cursor: [1, 5]
    keys: 'diw'
  - id: textobj/diw-on-whitespace
    note: the blank run is itself an inner object
    buffer: 'alpha beta'
    cursor: [1, 6]
    keys: 'diw'
  - id: textobj/daw-on-whitespace-takes-the-next-word
    buffer: 'alpha beta'
    cursor: [1, 6]
    keys: 'daw'
  - id: textobj/diw-first-word
    buffer: 'alpha beta'
    cursor: [1, 1]
    keys: 'diw'
  - id: textobj/daw-first-word
    buffer: 'alpha beta'
    cursor: [1, 1]
    keys: 'daw'
  - id: textobj/d2iw
    note: each extra count adds the NEXT run, alternating word and whitespace
    buffer: 'alpha beta gamma'
    cursor: [1, 1]
    keys: 'd2iw'
  - id: textobj/d3iw
    buffer: 'alpha beta gamma'
    cursor: [1, 1]
    keys: 'd3iw'
  - id: textobj/d2aw
    note: each extra count adds a whole word WITH its whitespace
    buffer: 'alpha beta gamma'
    cursor: [1, 1]
    keys: 'd2aw'
  - id: textobj/diw-punctuation-run
    buffer: 'foo.bar'
    cursor: [1, 4]
    keys: 'diw'
  - id: textobj/daw-punctuation-run
    note: punctuation is its own word class, and it has no whitespace either side
    buffer: 'foo.bar'
    cursor: [1, 4]
    keys: 'daw'
  - id: textobj/diW-crosses-punctuation
    buffer: 'foo.bar baz'
    cursor: [1, 4]
    keys: 'diW'
  - id: textobj/daW-crosses-punctuation
    buffer: 'foo.bar baz'
    cursor: [1, 4]
    keys: 'daW'
  - id: textobj/diw-on-empty-line-is-degenerate
    note: nothing to take, but the region exists — no register is written
    buffer: ['a', '', 'b']
    cursor: [2, 1]
    keys: 'diw'
  - id: textobj/daw-on-empty-line-crosses-the-break
    note: >-
      the empty line counts as whitespace, so `aw` takes it plus the following
      word — which spans a line boundary and is then promoted to linewise by
      op_delete's rule
    buffer: ['a', '', 'b']
    cursor: [2, 1]
    keys: 'daw'
  - id: textobj/ciw-mid-word
    buffer: 'alpha beta gamma'
    cursor: [1, 8]
    keys: 'ciwXY<Esc>'
  - id: textobj/caw-mid-word
    buffer: 'alpha beta gamma'
    cursor: [1, 8]
    keys: 'cawXY<Esc>'
  - id: textobj/yiw-mid-word
    buffer: 'alpha beta'
    cursor: [1, 8]
    keys: 'yiw'
  - id: textobj/yaw-mid-word
    note: yank lands the cursor on the start of the region, one column left of the word
    buffer: 'alpha beta'
    cursor: [1, 8]
    keys: 'yaw'
  - id: textobj/gUiw
    buffer: 'alpha beta'
    cursor: [1, 8]
    keys: 'gUiw'
  - id: textobj/diw-then-u
    buffer: 'alpha beta'
    cursor: [1, 8]
    keys: ['diw', 'u']
  - id: textobj/diw-empty-line-mints-an-undo-node
    note: >-
      a DEGENERATE object still runs, so `u` burns on it and the `x` survives.
      The empty line must be in the MIDDLE of the buffer: on the LAST line `iw`
      reaches backward instead and is not degenerate at all (below).
    buffer: ['ab', '', 'c']
    cursor: [1, 1]
    keys: ['x', 'j', 'diw', 'u']
  - id: textobj/diw-on-empty-last-line-reaches-backward
    note: >-
      `fwd_word` cannot advance off the last line, so Vim's `decl` steps back
      onto the PREVIOUS line's last character — an inverted region that
      op_delete then promotes to whole lines. Nothing about `iw` suggests this.
    buffer: ['b', '']
    cursor: [2, 1]
    keys: 'diw'
  - id: textobj/yiw-on-empty-last-line-is-charwise
    note: the same region, but yank has no promotion — so the register is charwise here and linewise for `d`
    buffer: ['b', '']
    cursor: [2, 1]
    keys: 'yiw'
  - id: textobj/diw-on-empty-last-line-three-lines
    buffer: ['a', 'b', '']
    cursor: [3, 1]
    keys: 'diw'
  - id: textobj/daw-on-empty-last-line-fails
    note: '`aw` uses end_word, which genuinely FAILS at end of buffer — so nothing happens at all'
    buffer: ['b', '']
    cursor: [2, 1]
    keys: ['x', 'j', 'daw', 'u']
  - id: textobj/diw-on-the-only-line-being-empty
    buffer: ['']
    cursor: [1, 1]
    keys: 'diw'
  - id: textobj/diw-blank-run-on-last-line
    buffer: ['b', '   ']
    cursor: [2, 2]
    keys: 'diw'

  # --- i( / a( and the bracket family ---------------------------------------
  - id: textobj/di-paren-inline
    buffer: 'fn(a, b) end'
    cursor: [1, 5]
    keys: 'di('
  - id: textobj/da-paren-inline
    buffer: 'fn(a, b) end'
    cursor: [1, 5]
    keys: 'da('
  - id: textobj/di-paren-cursor-on-open
    note: sitting ON the open bracket selects that pair, it does not look outward
    buffer: 'fn(a,b)'
    cursor: [1, 3]
    keys: 'di('
  - id: textobj/di-paren-cursor-on-close
    buffer: 'fn(a,b)'
    cursor: [1, 7]
    keys: 'di('
  - id: textobj/di-paren-empty-is-degenerate
    note: found but EMPTY — deletes nothing, writes no register, cursor moves between the brackets
    buffer: 'fn()'
    cursor: [1, 3]
    keys: 'di('
  - id: textobj/ci-paren-empty-still-enters-insert
    note: the degenerate region is why `ci(` on `()` can type between the brackets at all
    buffer: 'fn()'
    cursor: [1, 3]
    keys: 'ci(X<Esc>'
  - id: textobj/di-paren-not-found-mints-nothing
    note: NOT FOUND aborts the operator entirely — `u` must reach past it to the `x`
    buffer: 'plain text'
    cursor: [1, 3]
    keys: ['x', 'di(', 'u']
  - id: textobj/di-paren-cursor-before-the-block-on-the-same-line
    note: >-
      the cursor is OUTSIDE the parentheses, yet the object is still found —
      `findmatch` looks ahead on the line. ":h ib" says the cursor must be
      inside the block, and that is not what the code does.
    buffer: 'fn(a, b)'
    cursor: [1, 1]
    keys: 'di('
  - id: textobj/di-paren-block-later-on-the-line
    buffer: 'xx yy (a) zz'
    cursor: [1, 2]
    keys: 'di('
  - id: textobj/di-brace-before-the-block-on-the-same-line
    buffer: 'head {a} tail'
    cursor: [1, 2]
    keys: 'di{'
  - id: textobj/di-paren-block-on-a-LATER-line
    note: >-
      does the look-ahead stop at the end of the line, or run on into the
      buffer? Authored not knowing — the oracle decides.
    buffer: ['plain', 'fn(a, b)']
    cursor: [1, 2]
    keys: ['x', 'di(', 'u']
  - id: textobj/d2i-paren-nested
    note: a count walks OUTWARD one pair at a time
    buffer: 'a(b(c)d)e'
    cursor: [1, 5]
    keys: 'd2i('
  - id: textobj/d2a-paren-nested
    buffer: 'a(b(c)d)e'
    cursor: [1, 5]
    keys: 'd2a('
  - id: textobj/di-paren-nested-inner
    buffer: 'a(b(c)d)e'
    cursor: [1, 5]
    keys: 'di('
  - id: textobj/di-paren-spans-lines
    buffer: ['fn(a,', 'b) end']
    cursor: [1, 4]
    keys: 'di('
  - id: textobj/di-bracket-square
    buffer: 'x[1, 2]y'
    cursor: [1, 4]
    keys: 'di['
  - id: textobj/da-bracket-square
    buffer: 'x[1, 2]y'
    cursor: [1, 4]
    keys: 'da['
  - id: textobj/di-angle
    buffer: 'x<abc>y'
    cursor: [1, 4]
    keys: 'di<'
  - id: textobj/da-angle
    buffer: 'x<abc>y'
    cursor: [1, 4]
    keys: 'da<'
  - id: textobj/di-brace-inline
    buffer: 'x {body} y'
    cursor: [1, 4]
    keys: 'di{'
  - id: textobj/alias-ib-is-i-paren
    buffer: 'f(a)'
    cursor: [1, 3]
    keys: 'dib'
  - id: textobj/alias-aB-is-a-brace
    buffer: 'x{a}y'
    cursor: [1, 3]
    keys: 'daB'
  - id: textobj/alias-closing-half-names-the-pair
    buffer: 'f(a)'
    cursor: [1, 3]
    keys: 'di)'
  - id: textobj/alias-i-brace-close
    buffer: 'x{ab}y'
    cursor: [1, 4]
    keys: 'di}'

  # --- the linewise block, which no key in the command announces -------------
  - id: textobj/di-brace-body-on-its-own-line-is-linewise
    note: >-
      the braces sit on their own lines, so `i{` is LINEWISE — the body line
      goes away entirely rather than being emptied
    buffer: ['{', '  body', '}']
    cursor: [2, 3]
    keys: 'di{'
  - id: textobj/yi-brace-body-on-its-own-line-is-linewise
    note: same shape, and the register type is what proves it
    buffer: ['{', '  body', '}']
    cursor: [2, 3]
    keys: 'yi{'
  - id: textobj/ci-brace-body-on-its-own-line
    note: linewise change keeps ONE line to type into, exactly as `cc` does
    buffer: ['{', '  body', '}']
    cursor: [2, 3]
    keys: 'ci{Z<Esc>'
  - id: textobj/di-brace-two-body-lines
    buffer: ['{', '  a', '  b', '}']
    cursor: [2, 3]
    keys: 'di{'
  - id: textobj/da-brace-body-on-its-own-line
    buffer: ['{', '  body', '}']
    cursor: [2, 3]
    keys: 'da{'
  - id: textobj/ya-brace-body-on-its-own-line
    note: does `a{` get the linewise treatment too, or only `i{`?
    buffer: ['{', '  body', '}']
    cursor: [2, 3]
    keys: 'ya{'
  - id: textobj/di-brace-adjacent-lines-no-body
    note: nothing between the braces at all — the linewise promotion must not fire
    buffer: ['{', '}']
    cursor: [1, 1]
    keys: 'di{'
  - id: textobj/di-brace-open-not-last-on-line
    note: text after the open brace, so the block is NOT whole lines
    buffer: ['{ head', '  mid', '}']
    cursor: [2, 3]
    keys: 'di{'
  - id: textobj/di-brace-close-not-alone-on-line
    buffer: ['{', '  mid', 'tail }']
    cursor: [2, 3]
    keys: 'di{'
  - id: textobj/yi-brace-cursor-lands-on-column-one
    note: a linewise OBJECT pulls the cursor to column one, unlike a linewise motion
    buffer: ['{', '    body', '}']
    cursor: [2, 6]
    keys: 'yi{'
  - id: textobj/indent-operator-over-a-linewise-block
    buffer: ['{', '  body', '}']
    cursor: [2, 3]
    keys: '>i{'

  # --- i" / a" --------------------------------------------------------------
  - id: textobj/di-quote-inside
    buffer: 'say "hello there" ok'
    cursor: [1, 8]
    keys: 'di"'
  - id: textobj/da-quote-inside
    note: a" takes the quotes AND the trailing whitespace
    buffer: 'say "hello there" ok'
    cursor: [1, 8]
    keys: 'da"'
  - id: textobj/da-quote-no-trailing-takes-leading
    buffer: 'a "b"'
    cursor: [1, 4]
    keys: 'da"'
  - id: textobj/di-quote-cursor-before-the-pair
    note: not inside a pair, so it uses the next pair on the line
    buffer: 'say "hello" ok'
    cursor: [1, 1]
    keys: 'di"'
  - id: textobj/di-quote-cursor-on-open
    buffer: 'a "b" c'
    cursor: [1, 3]
    keys: 'di"'
  - id: textobj/di-quote-cursor-on-close
    buffer: 'a "bc" d'
    cursor: [1, 6]
    keys: 'di"'
  - id: textobj/di-quote-escaped-quote-is-not-a-delimiter
    buffer: 'a "b\"c" d'
    cursor: [1, 5]
    keys: 'di"'
  - id: textobj/di-quote-empty-is-degenerate
    buffer: 'a "" b'
    cursor: [1, 4]
    keys: 'di"'
  - id: textobj/di-quote-between-two-pairs-takes-the-gap
    note: >-
      quotes are CHAINED, not paired off disjointly — the span between two
      strings is itself a quoted object, so this deletes ` x ` rather than
      jumping ahead to `two`. Pairing (q0,q1),(q2,q3) looks far more sensible
      and is wrong.
    buffer: '"one" x "two"'
    cursor: [1, 7]
    keys: 'di"'
  - id: textobj/di-quote-gap-from-its-left-edge
    buffer: '"one" x "two"'
    cursor: [1, 6]
    keys: 'di"'
  - id: textobj/di-quote-gap-from-its-right-edge
    buffer: '"one" x "two"'
    cursor: [1, 8]
    keys: 'di"'
  - id: textobj/da-quote-between-two-pairs
    buffer: '"one" x "two"'
    cursor: [1, 7]
    keys: 'da"'
  - id: textobj/di-quote-odd-count-of-quotes
    buffer: '"a" b "c'
    cursor: [1, 5]
    keys: 'di"'
  - id: textobj/di-quote-after-the-last-pair-fails
    buffer: '"one" tail'
    cursor: [1, 8]
    keys: ['x', 'di"', 'u']
  - id: textobj/di-single-quote
    buffer: "it 'x y' z"
    cursor: [1, 6]
    keys: "di'"
  - id: textobj/da-single-quote
    buffer: "it 'x y' z"
    cursor: [1, 6]
    keys: "da'"
  - id: textobj/di-quote-none-on-line-mints-nothing
    buffer: ['abc', 'no quotes']
    cursor: [2, 3]
    keys: ['x', 'di"', 'u']
  - id: textobj/ci-quote
    buffer: 'say "old" ok'
    cursor: [1, 7]
    keys: 'ci"new<Esc>'

  # --- ip / ap --------------------------------------------------------------
  - id: textobj/dip-in-a-paragraph
    buffer: ['a', 'b', '', 'c']
    cursor: [1, 1]
    keys: 'dip'
  - id: textobj/dap-in-a-paragraph
    note: ap adds the run of blank lines that FOLLOWS
    buffer: ['a', 'b', '', 'c']
    cursor: [1, 1]
    keys: 'dap'
  - id: textobj/dip-on-a-blank-run
    note: a run of blank lines is itself a paragraph object
    buffer: ['a', '', '', 'b']
    cursor: [2, 1]
    keys: 'dip'
  - id: textobj/dap-on-a-blank-run
    buffer: ['a', '', '', 'b']
    cursor: [2, 1]
    keys: 'dap'
  - id: textobj/dap-last-paragraph-takes-the-blanks-before-it
    note: nothing follows, so `ap` reaches BACKWARD instead
    buffer: ['a', '', 'b', 'c']
    cursor: [3, 1]
    keys: 'dap'
  - id: textobj/yip-cursor-lands-on-column-one
    note: the linewise-object cursor rule again, this time with no braces involved
    buffer: ['  hello world', 'x']
    cursor: [1, 8]
    keys: 'yip'
  - id: textobj/yy-keeps-its-column
    note: the control for the case above — a linewise MOTION leaves the column alone
    buffer: ['  hello world', 'x']
    cursor: [1, 8]
    keys: 'yy'
  - id: textobj/dip-whitespace-only-line-counts-as-blank
    buffer: ['a', '   ', 'b']
    cursor: [1, 1]
    keys: 'dip'
  - id: textobj/cip
    buffer: ['a', 'b', '', 'c']
    cursor: [1, 1]
    keys: 'cipZ<Esc>'

  # --- it / at --------------------------------------------------------------
  - id: textobj/dit-simple
    buffer: '<a>text</a>'
    cursor: [1, 5]
    keys: 'dit'
  - id: textobj/dat-simple
    buffer: '<a>text</a>'
    cursor: [1, 5]
    keys: 'dat'
  - id: textobj/dit-nested-takes-the-innermost
    buffer: '<a><b>x</b></a>'
    cursor: [1, 7]
    keys: 'dit'
  - id: textobj/d2it-nested-walks-outward
    buffer: '<a><b>x</b></a>'
    cursor: [1, 7]
    keys: 'd2it'
  - id: textobj/dit-spans-lines
    buffer: ['<a>', '  x', '</a>']
    cursor: [2, 3]
    keys: 'dit'
  - id: textobj/dit-tag-with-attributes
    buffer: '<a href="q">x</a>'
    cursor: [1, 13]
    keys: 'dit'
  - id: textobj/dit-cursor-inside-the-open-tag
    buffer: '<a href="q">x</a>'
    cursor: [1, 4]
    keys: 'dit'
  - id: textobj/dit-empty-element-is-degenerate
    buffer: '<a></a>'
    cursor: [1, 2]
    keys: 'dit'
  - id: textobj/dit-no-tag-mints-nothing
    buffer: 'plain text'
    cursor: [1, 3]
    keys: ['x', 'dit', 'u']
  - id: textobj/cit
    buffer: '<a>old</a>'
    cursor: [1, 5]
    keys: 'citnew<Esc>'
  - id: textobj/yat
    buffer: '<a>text</a> tail'
    cursor: [1, 5]
    keys: 'yat'

  # --- objects in a register, and with a count register prefix --------------
  - id: textobj/named-register-with-an-object
    buffer: 'fn(a, b) end'
    cursor: [1, 5]
    keys: '"ayi('
  - id: textobj/blackhole-delete-with-an-object
    note: '"_ swallows the text, so unnamed still holds the earlier yank'
    buffer: ['fn(a, b)', 'keep']
    cursor: [2, 1]
    keys: ['yy', 'gg', '"_di(']
