# Paragraph `{ }` and sentence `( )` motions.
#
# These were in MergedPlan's Wave 1 inventory and no wave ever implemented
# them. They land with Wave 3 because they are JUMP commands — they set the
# previous-context mark and push the jumplist — and because they are on Vim's
# short list of motions whose deletes always shift into `"1`.
#
# The two rules worth stating up front, both measured and both easy to write
# backwards:
#
#  - A paragraph boundary is a genuinely EMPTY line, not a blank one. `}` walks
#    straight past a line of spaces.
#  - Running off the end of the buffer only FAILS while counts remain. A bare
#    `}` at the end succeeds and does not move, so `d}` there still mints an
#    undo node; `d2}` aborts and mints none.

cases:
  # --- `}` forward ----------------------------------------------------------
  - id: motions/brace-fwd-to-blank
    note: the plain case — stop on the empty line separating two paragraphs
    buffer: ['alpha', 'beta', '', 'gamma', 'delta', '', 'epsilon']
    cursor: [1, 1]
    keys: '}'

  - id: motions/brace-fwd-twice
    buffer: ['alpha', 'beta', '', 'gamma', 'delta', '', 'epsilon']
    cursor: [1, 1]
    keys: '}}'

  - id: motions/brace-fwd-count
    note: 2} is }} — the count is iterations, not lines
    buffer: ['alpha', 'beta', '', 'gamma', 'delta', '', 'epsilon']
    cursor: [1, 1]
    keys: '2}'

  - id: motions/brace-fwd-to-eob
    note: past the last paragraph lands on the LAST CHARACTER of the last line
    buffer: ['alpha', 'beta', '', 'gamma', 'delta', '', 'epsilon']
    cursor: [1, 1]
    keys: '}}}'

  - id: motions/brace-fwd-at-eob-noop
    note: a bare } at the end does NOT beep, it simply does not move
    buffer: ['alpha', 'beta', '', 'gamma', 'delta', '', 'epsilon']
    cursor: [1, 1]
    keys: '}}}}'

  - id: motions/brace-fwd-from-blank-skips-run
    note: >
      did_skip: the walk will not accept a boundary until it has passed a
      NON-empty line, so from inside a run of blanks it clears the whole run
      rather than stopping on the next one
    buffer: ['alpha', '', '', 'beta']
    cursor: [1, 1]
    keys: '}}'

  - id: motions/brace-fwd-lands-on-first-blank
    buffer: ['alpha', '', '', 'beta']
    cursor: [1, 1]
    keys: '}'

  - id: motions/brace-fwd-from-empty-line
    buffer: ['alpha', '', 'beta', '', 'gamma']
    cursor: [2, 1]
    keys: '}'

  - id: motions/brace-fwd-spaces-are-not-blank
    note: >
      THE wart. A line of spaces is not a paragraph boundary — startPS tests
      for a genuinely empty line — so } walks past it to the end of the buffer
    buffer: ['alpha', '   ', 'beta']
    cursor: [1, 1]
    keys: '}'

  - id: motions/brace-fwd-formfeed-is-boundary
    note: a leading form feed IS a boundary, unlike a line of spaces
    buffer: ['alpha', "\fbeta", 'gamma']
    cursor: [1, 1]
    keys: '}'

  - id: motions/brace-fwd-no-blank-at-all
    buffer: ['alpha', 'beta']
    cursor: [1, 1]
    keys: '}'

  - id: motions/brace-fwd-one-line-buffer
    buffer: 'alpha beta'
    cursor: [1, 3]
    keys: '}'

  - id: motions/brace-fwd-empty-last-line
    note: an empty last line has no character to land on, so no inclusive pullback
    buffer: ['alpha', '']
    cursor: [1, 1]
    keys: '}'

  # --- `{` backward ---------------------------------------------------------
  - id: motions/brace-back-to-blank
    buffer: ['alpha', 'beta', '', 'gamma', 'delta', '', 'epsilon']
    cursor: [7, 3]
    keys: '{'

  - id: motions/brace-back-twice
    buffer: ['alpha', 'beta', '', 'gamma', 'delta', '', 'epsilon']
    cursor: [7, 3]
    keys: '{{'

  - id: motions/brace-back-to-bof
    buffer: ['alpha', 'beta', '', 'gamma', 'delta', '', 'epsilon']
    cursor: [7, 3]
    keys: '{{{'

  - id: motions/brace-back-at-bof-noop
    buffer: ['alpha', 'beta', '', 'gamma']
    cursor: [1, 1]
    keys: '{'

  - id: motions/brace-back-one-line-buffer
    note: >
      backward never takes the inclusive last-line pullback, even though this
      "lands on the last line" — measured, and the reason the rule is written
      as forward-only rather than as "curr == last"
    buffer: 'alpha beta'
    cursor: [1, 3]
    keys: '{'

  # --- `}` with operators ---------------------------------------------------
  - id: motions/d-brace-linewise-promotion
    note: >
      exclusive-linewise rule 2 — the region ends in column one of a later line
      and started at the first non-blank, so the whole thing becomes linewise
    buffer: ['alpha', 'beta', '', 'gamma']
    cursor: [1, 1]
    keys: 'd}'

  - id: motions/d-brace-midline-stays-charwise
    note: rule 1 instead — started past the indent, so the newline is not eaten
    buffer: ['alpha beta', 'gamma', '', 'delta']
    cursor: [1, 7]
    keys: 'd}'

  - id: motions/d-brace-at-eob-takes-last-char
    note: the forward last-line pullback makes the motion inclusive
    buffer: ['alpha', 'beta']
    cursor: [2, 4]
    keys: 'd}'

  - id: motions/d-brace-single-line-forces-numbered
    note: >
      a delete over } lands in BOTH "1 and "- even though it is a small,
      single-line delete. This is the `use_reg_one` rule that % also has
    buffer: 'alpha beta'
    cursor: [1, 1]
    keys: 'd}'

  - id: motions/d-brace-empty-last-line
    buffer: ['alpha', '']
    cursor: [1, 1]
    keys: 'd}'

  - id: motions/d-brace-count-overshoot-fails
    note: >
      with a count REMAINING the walk fails, the operator aborts, and nothing
      is minted — the opposite of the bare } above
    buffer: ['alpha', 'beta']
    cursor: [1, 1]
    keys: 'd2}'

  - id: motions/d-brace-back-at-bof-degenerate
    note: >
      { at the start of the buffer SUCCEEDS without moving, so the operator
      runs over a degenerate region: no register is touched, but an undo node
      is minted — pinned by the following `u` restoring the x, not the d{
    buffer: ['alpha', 'beta']
    cursor: [1, 1]
    keys: ['x', 'd{', 'u']

  - id: motions/y-brace-linewise
    buffer: ['alpha', 'beta', '', 'gamma']
    cursor: [1, 1]
    keys: 'y}'

  - id: motions/y-brace-charwise-keeps-cursor
    buffer: ['alpha', 'beta', '', 'gamma']
    cursor: [2, 3]
    keys: 'y}'

  - id: motions/c-brace-linewise
    buffer: ['alpha', 'beta', '', 'gamma']
    cursor: [1, 1]
    keys: 'c}X<Esc>'

  - id: motions/d-brace-back
    buffer: ['alpha', 'beta', '', 'gamma']
    cursor: [4, 3]
    keys: 'd{'

  - id: motions/gU-brace
    buffer: ['alpha', 'beta', '', 'gamma']
    cursor: [1, 1]
    keys: 'gU}'

  - id: motions/indent-brace
    buffer: ['alpha', 'beta', '', 'gamma']
    cursor: [1, 1]
    keys: '>}'

  # --- `)` forward ----------------------------------------------------------
  - id: motions/sent-fwd-1
    buffer: 'One. Two! Three? Four.'
    cursor: [1, 1]
    keys: ')'

  - id: motions/sent-fwd-2
    buffer: 'One. Two! Three? Four.'
    cursor: [1, 1]
    keys: '))'

  - id: motions/sent-fwd-3
    buffer: 'One. Two! Three? Four.'
    cursor: [1, 1]
    keys: ')))'

  - id: motions/sent-fwd-count
    buffer: 'One. Two! Three? Four.'
    cursor: [1, 1]
    keys: '2)'

  - id: motions/sent-fwd-to-eob
    note: the last ) lands on the final character, inclusive via adjust_cursor
    buffer: 'One. Two! Three? Four.'
    cursor: [1, 1]
    keys: '))))'

  - id: motions/sent-fwd-eob-noop
    buffer: 'Only one.'
    cursor: [1, 1]
    keys: '))'

  - id: motions/sent-fwd-multi-space
    note: all the whitespace after the terminator is skipped, however much
    buffer: 'One.   Two.'
    cursor: [1, 1]
    keys: ')'

  - id: motions/sent-fwd-closers
    note: >
      any run of )]"' may sit between the terminator and the whitespace, so
      the sentence ends after the `)` here
    buffer: 'He said "go.") Next one.'
    cursor: [1, 1]
    keys: ')'

  - id: motions/sent-fwd-no-space-after-dot
    note: >
      a.b.c is ONE sentence — the dots have no whitespace after them, which is
      exactly what stops filenames and abbreviations from splitting
    buffer: 'a.b.c done. Next.'
    cursor: [1, 1]
    keys: ')'

  - id: motions/sent-fwd-across-lines
    note: an end of line terminates a sentence just as a space does
    buffer: ['One. Two.', 'Three. Four.']
    cursor: [1, 1]
    keys: '))'

  - id: motions/sent-fwd-stops-on-empty-line
    note: a paragraph boundary is a sentence boundary, and ) lands ON it
    buffer: ['One. Two.', '', 'Three.']
    cursor: [1, 6]
    keys: ')'

  - id: motions/sent-fwd-past-empty-line
    buffer: ['One. Two.', '', 'Three.']
    cursor: [1, 6]
    keys: '))'

  - id: motions/sent-fwd-from-empty-line
    buffer: ['One.', '', 'Two. Three.']
    cursor: [2, 1]
    keys: ')'

  # --- `(` backward ---------------------------------------------------------
  - id: motions/sent-back-1
    buffer: 'One. Two! Three? Four.'
    cursor: [1, 18]
    keys: '('

  - id: motions/sent-back-2
    buffer: 'One. Two! Three? Four.'
    cursor: [1, 18]
    keys: '(('

  - id: motions/sent-back-from-midsentence
    note: from the middle, ( goes to THIS sentence's start
    buffer: 'One. Two! Three? Four.'
    cursor: [1, 13]
    keys: '('

  - id: motions/sent-back-from-sentence-start
    note: >
      …but from the exact first character it goes to the PREVIOUS one. That
      asymmetry is what the walk-back-over-punctuation loop exists for
    buffer: 'One. Two. Three.'
    cursor: [1, 6]
    keys: '('

  - id: motions/sent-back-at-bof-noop
    buffer: 'Only one.'
    cursor: [1, 1]
    keys: '('

  - id: motions/sent-back-from-empty-line
    buffer: ['One. Two.', '', 'Three.']
    cursor: [2, 1]
    keys: '('

  # --- `)` with operators ---------------------------------------------------
  - id: motions/d-sent-fwd-forces-numbered
    note: like }, a small single-line delete over ) sets BOTH "1 and "-
    buffer: 'One. Two. Three.'
    cursor: [1, 1]
    keys: 'd)'

  - id: motions/d-sent-back
    buffer: 'One. Two. Three.'
    cursor: [1, 11]
    keys: 'd('

  - id: motions/d-sent-at-eob-takes-last-char
    buffer: 'Only one.'
    cursor: [1, 9]
    keys: 'd)'

  - id: motions/d-sent-back-at-bof-degenerate
    note: ( at the start succeeds without moving — degenerate region, node minted
    buffer: 'Only one.'
    cursor: [1, 1]
    keys: ['x', 'd(', 'u']

  - id: motions/c-sent-fwd
    buffer: 'One. Two. Three.'
    cursor: [1, 1]
    keys: 'c)X<Esc>'

  - id: motions/y-sent-fwd
    buffer: 'One. Two. Three.'
    cursor: [1, 6]
    keys: 'y)'

  - id: motions/d-sent-across-lines
    buffer: ['One. Two.', 'Three. Four.']
    cursor: [1, 6]
    keys: 'd)'

  # --- visual mode ----------------------------------------------------------
  - id: motions/visual-brace
    note: >
      in VISUAL mode the exclusive-linewise adjustment does not apply — the
      selection is charwise inclusive of the cursor cell, so this eats the
      newlines the operator-pending form would have left
    buffer: ['alpha', 'beta', '', 'gamma']
    cursor: [1, 1]
    keys: 'v}d'

  - id: motions/visual-sent-no-forced-numbered
    note: >
      and visual mode does NOT force the numbered register: this small delete
      sets "- alone, where the operator-pending `d)` above sets "1 too
    buffer: 'One. Two. Three.'
    cursor: [1, 1]
    keys: 'v)d'

  - id: motions/visual-line-brace
    buffer: ['alpha', 'beta', '', 'gamma']
    cursor: [1, 1]
    keys: 'V}d'
