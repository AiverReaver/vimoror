<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>vimorror render demo</title>
    <style>
      body {
        background: #111;
        color: #ddd;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }
      canvas {
        border: 1px solid #444;
        background: #000;
      }
      #panes {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      #panes figure {
        margin: 0;
      }
      #panes figcaption {
        font-family: monospace;
        font-size: 12px;
        padding-top: 4px;
        color: #999;
      }
      #fallback-pane[hidden] {
        display: none;
      }
      #hud,
      #controls {
        display: flex;
        gap: 24px;
        align-items: center;
        font-family: monospace;
      }
      #buttons button {
        margin: 2px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1>vimorror render — CRT pipeline demo</h1>
    <div id="panes">
      <figure>
        <canvas id="grid" tabindex="0"></canvas>
        <figcaption>primary — path: <span id="path">?</span></figcaption>
      </figure>
      <figure id="fallback-pane">
        <canvas id="grid-fallback"></canvas>
        <figcaption>forced fallback — no post-FX</figcaption>
      </figure>
    </div>
    <div id="controls">
      <label
        >Effects Intensity
        <input id="intensity" type="range" min="0" max="100" value="60" />
        <span id="intensity-readout">0.60</span>
      </label>
      <label><input id="force-fallback" type="checkbox" checked /> show forced fallback</label>
    </div>
    <div id="hud">
      <div>mode: <span id="mode">normal</span></div>
      <div>pending: <span id="pending">(none)</span></div>
    </div>
    <div id="buttons">
      <button data-keys="dd">dd</button>
      <button data-keys="d2w">d2w</button>
      <button data-keys="ci(">ci(</button>
      <button data-keys="yyp">yyp</button>
      <button data-keys="v$d">v$d</button>
      <button data-keys="gg">gg</button>
      <button data-keys="G">G</button>
      <button data-keys="u">u</button>
      <button data-keys="&lt;C-r&gt;">redo</button>
    </div>
    <p>Click the page, then type — real vim-core underneath. Esc for normal mode.</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
